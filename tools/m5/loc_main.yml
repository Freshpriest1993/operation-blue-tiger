 TAI_reclamation_allowed_tt: "The §YReturn to the Mainland§! game rule allows this country to take the path"
 TAI_beijing_in_crisis_tt: "Beijing is in crisis: China is in a civil war, at war with a major power, or below §Y25%§! stability"
 TAI_repelled_invasion_tt: "We control every state we own"
 TAI_holds_mainland_capitals_tt: "We control Beijing, Nanjing, Shanghai, Guangdong, Hubei and Chongqing"
 TAI_mainland_control_tt: "We control at least §Y75%§! of the mainland's states (currently §Y[?TAI_mainland_control|0]%§!)"
 TAI_restoration_requirements_tt: "Full restoration needs §YBeijing, Nanjing, Shanghai, Guangdong, Hubei and Chongqing§! under our control, at least §Y75%§! of the mainland's states (we hold §Y[?TAI_mainland_control|0]%§!), an army of §Y60§! or more divisions, §Y40%§! stability and §Y50%§! war support."
 ROC_region_held_tt: "We own and control every state of this region that we hold, and hold at least one"
 TAI_reclamation_category: "Return to the Mainland"
 TAI_reclamation_category_desc: "§RAlternate history.§! In 1991 the Republic of China ended the Period of National Mobilization for Suppression of the Communist Rebellion and committed itself to peaceful means. This path breaks with that settlement. The island will fight for the mainland only on terms it can accept, and the balance between §YROC Restoration§! and §YTaiwanese Self-Determination§! decides what happens after victory."
 ROC_administration_category: "Provisional Administration"
 ROC_administration_category_desc: "The Republic's authority on the mainland rests on provisional decrees and military administrators. Restoring civil government region by region removes the penalties of §YProvisional Administration§!."
 TAI_convene_reclamation_pact: "Convene the Reclamation Pact"
 TAI_convene_reclamation_pact_desc: "Bring the parties, the generals and civic groups together to agree the terms on which Taiwan would fight for the mainland."
 TAI_carry_war_across_strait: "Carry the War Across the Strait"
 TAI_carry_war_across_strait_desc: "The invasion has failed. Pursue the enemy to the mainland. Washington's commitment covers Taiwan's defense, not this."
 TAI_strike_while_beijing_divided: "Strike While Beijing Is Divided"
 TAI_strike_while_beijing_divided_desc: "Beijing is in crisis. A war of our choosing would cost us the trust of the United States."
 TAI_reclamation_armistice: "The Reclamation Armistice"
 TAI_resume_reclamation_war: "Resume the Reclamation War"
 TAI_resume_reclamation_war_desc: "The armistice has given us time to rebuild. End it, and finish what the last war began."
 TAI_mobilize_for_reclamation: "Mobilize for Reclamation"
 TAI_mobilize_for_reclamation_desc: "Call up reservists and put the economy on a war footing."
 TAI_appeal_to_compatriots: "Appeal to Our Compatriots"
 TAI_appeal_to_compatriots_desc: "Broadcast the Republic's promises across the Strait: free elections, land reform, an end to the party-state."
 TAI_reassure_the_island: "Reassure the Island"
 TAI_reassure_the_island_desc: "Remind the people of Taiwan that the war is fought for their freedom too, and that their voice will count when it ends."
 TAI_negotiate_island_grievances: "Negotiate with the Island Opposition"
 TAI_negotiate_island_grievances_desc: "Open talks with the island's opposition to repair some of the damage done by breaking the pact."
 TAI_suppress_island_opposition: "Suppress the Island Opposition"
 TAI_suppress_island_opposition_desc: "Arrest the organizers and ban the demonstrations. Washington will notice."
 ROC_restore_north_china: "Restore Administration: North China"
 ROC_restore_north_china_desc: "Replace the military administrators of the North China Plain, from Beijing to Wuhan, with civil government."
 ROC_restore_east_china: "Restore Administration: East China"
 ROC_restore_east_china_desc: "Restore civil government in the Yangtze delta and the coastal provinces from Shandong's borders to Fujian."
 ROC_restore_south_china: "Restore Administration: South China"
 ROC_restore_south_china_desc: "Restore civil government in Guangdong, the southwest and Sichuan."
 ROC_restore_northeast: "Restore Administration: The Northeast"
 ROC_restore_northeast_desc: "Restore civil government in the old industrial northeast and Inner Mongolia."
 ROC_restore_northwest: "Restore Administration: The Northwest"
 ROC_restore_northwest_desc: "Restore civil government in the northwest and the Tibetan plateau, where the Republic's authority has always been thinnest."
 TAI_reclamation_bop: "Postwar Vision"
 TAI_bop_restoration: "ROC Restoration\n\nThe Republic is one country, and the war restores it."
 TAI_bop_self_determination: "Taiwanese Self-Determination\n\nThe people of Taiwan decide Taiwan's future."
 TAI_bop_contested: "A Divided Purpose"
 TAI_bop_restoration_ascendant: "Restoration Ascendant"
 TAI_bop_restoration_fervor: "Restoration Fervor"
 TAI_bop_self_determination_ascendant: "Self-Determination Ascendant"
 TAI_bop_self_determination_consensus: "Self-Determination Consensus"
 ROC_provisional_administration: "Provisional Administration"
 ROC_provisional_administration_desc: "Most of the country is governed by provisional decrees and military administrators. Each region restored to civil government, and each administrative reform, eases these penalties."
 TAI_reclamation_referendum_pledge: "Referendum Pledge"
 TAI_reclamation_referendum_pledge_desc: "We promised the people of Taiwan a referendum on their future after the war. Many who would not otherwise fight have enlisted."
 TAI_reclamation_autonomy_pledge: "Autonomy Pledge"
 TAI_reclamation_autonomy_pledge_desc: "We guaranteed Taiwan's autonomy within the restored Republic."
 TAI_reclamation_no_concessions: "No Concessions"
 TAI_reclamation_no_concessions_desc: "We promised the island nothing. Mobilization meets resistance at every level."
 TAI_broken_reclamation_pact: "Broken Reclamation Pact"
 TAI_broken_reclamation_pact_desc: "We broke the promise made to Taiwan before the war. The island's trust in the government is badly damaged."
 TAI_broken_reclamation_pact_severe: "Broken Reclamation Pact"
 TAI_broken_reclamation_pact_severe_desc: "We broke the promise made to Taiwan before the war, and the island had come to believe in it. Resistance runs through the legislature, the unions and the courts."
 TAI_island_crackdown: "Island Crackdown"
 TAI_island_crackdown_desc: "Demonstrations are banned and opposition organizers detained."
 TAI_taiwan_autonomy_charter: "Taiwan Autonomy Charter"
 TAI_taiwan_autonomy_charter_desc: "Taiwan governs its own internal affairs under a charter guaranteed by the Republic."
 TAI_cross_strait_partnership: "Cross-Strait Partnership"
 TAI_cross_strait_partnership_desc: "Taipei and the mainland government trade freely and settle disputes by negotiation."
 ROC_republic_restored: "The Republic Restored"
 ROC_republic_restored_desc: "Civil government reaches every region under the Republic's flag."
 ROC_three_principles_revived: "The Three Principles Revived"
 ROC_three_principles_revived_desc: "Nationalism, democracy and the people's livelihood guide the Republic's program on the mainland."
 ROC_reconstruction_program: "National Reconstruction Program"
 ROC_reconstruction_program_desc: "A national program directs money and labor to the projects the war left unfinished."
 ROC_national_army: "One National Army"
 ROC_national_army_desc: "One army, loyal to the constitution rather than a party."
 ROC_open_coast: "The Open Coast"
 ROC_open_coast_desc: "The coastal ports are open to world trade and foreign investment."
 CHI_ROC: "Republic of China"
 CHI_ROC_DEF: "the Republic of China"
 CHI_ROC_ADJ: "Chinese"
