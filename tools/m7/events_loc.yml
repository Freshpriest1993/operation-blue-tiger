 obt_strait.1.t: "Tension Rises in the Strait"
 obt_strait.1.d1: "Relations with Taipei have cooled into open friction. Our diplomats and theirs trade sharper words, and the business community is starting to notice."
 obt_strait.1.d2: "Our pressure on Taipei is now unmistakable. Every exercise and every statement is read in Taipei, Tokyo and Washington as coercion."
 obt_strait.1.d3: "The Strait has entered a crisis. Foreign navies are watching, markets are nervous, and the cost to our own economy is rising."
 obt_strait.1.d4: "The Strait stands at the brink. One miscalculation could start a war that no one in Beijing has formally decided to fight."
 obt_strait.1.a: "Press the advantage."
 obt_strait.1.b: "Hold our position."
 obt_strait.1.c: "Signal restraint."
 obt_strait.2.t: "The Strait Cools"
 obt_strait.2.d0: "Cross-Strait relations are calm. Trade flows, tourists cross and the generals on both sides are quiet."
 obt_strait.2.d1: "The worst of the confrontation has passed. Relations remain cool, but the danger of a clash has eased."
 obt_strait.2.d2: "The crisis has eased into steady pressure. We have room to choose our next step."
 obt_strait.2.d3: "We have stepped back from the brink, though the Strait remains in crisis."
 obt_strait.2.a: "Bank the calm."
 obt_strait.2.b: "Remind Taipei of our resolve."
 obt_strait.3.t: "Pressure Across the Strait"
 obt_strait.3.d1: "Beijing's tone has hardened and cross-Strait relations have slipped into friction. The public is uneasy but calm."
 obt_strait.3.d2: "Beijing is now openly coercing us: exercises near our waters, warnings to our partners, pressure on our businesses."
 obt_strait.3.d3: "The Strait is in crisis. Shipping insurers are raising rates, and Washington is asking what we intend to do."
 obt_strait.3.d4: "The Strait stands at the brink. Our forces are on alert, and the world is watching both capitals."
 obt_strait.3.a: "Stand firm."
 obt_strait.3.b: "Call for calm and dialogue."
 obt_strait.3.c: "Consult Washington."
 obt_strait.4.t: "The Strait Eases"
 obt_strait.4.d0: "Relations with the mainland are calm. Ferries run full, investors are confident and the coast guard has a quiet season."
 obt_strait.4.d1: "The confrontation has eased into friction. The pressure has not gone away, but the danger has passed for now."
 obt_strait.4.d2: "Beijing's pressure continues, but the crisis atmosphere has lifted."
 obt_strait.4.d3: "We have stepped back from the brink, though the Strait remains in crisis."
 obt_strait.4.a: "Reopen the channels."
 obt_strait.4.b: "Stay vigilant."
