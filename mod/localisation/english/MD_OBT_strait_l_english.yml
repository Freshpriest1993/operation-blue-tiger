l_english:
 # Operation Blue Tiger milestone 7: Cross-Strait Tension meter
 OBT_cross_strait_category: "Cross-Strait Relations"
 OBT_cross_strait_category_desc: "\n\n\n\n\n\n\n\n\nBeijing's pressure and Taipei's response move one shared measure, §YCross-Strait Tension§!. Higher stages harden the island's resolve but cost it trade and political capital; calm pays both sides. Pressure is not control: no stage forces war, annexation or capitulation."
 OBT_strait_meter_title: "Cross-Strait Tension: §Y[?global.OBT_strait_fill|0]§!/100   [OBT_strait_stage_name]"
 OBT_strait_meter_tt: "§YCross-Strait Tension§! is shared by Beijing and Taipei. It rises with coercion, blockades and provocations, and falls with dialogue, trade and restraint.\n\n§GCalm§! 0-19   §YFriction§! 20-39   §OCoercion§! 40-59   §RCrisis§! 60-79   §RBrink§! 80-100\n\nCurrent stage effects:\n[OBT_strait_stage_effects]\n\nNo stage starts a war, annexes Taiwan or forces it to capitulate."
 OBT_strait_tick: "§W|§!"
 OBT_strait_threshold_1_tt: "§Y20§!: Calm ends, Friction begins."
 OBT_strait_threshold_2_tt: "§Y40§!: Friction ends, Coercion begins. Crisis hotlines open."
 OBT_strait_threshold_3_tt: "§Y60§!: Coercion ends, Crisis begins. Taiwan can declare a Blue Tiger Emergency."
 OBT_strait_threshold_4_tt: "§Y80§!: Crisis ends, Brink begins. Beijing can prepare a contingency war goal; war still requires a declaration."
 OBT_strait_stage_calm: "Calm"
 OBT_strait_stage_friction: "Friction"
 OBT_strait_stage_coercion: "Coercion"
 OBT_strait_stage_crisis: "Crisis"
 OBT_strait_stage_brink: "Brink"
 OBT_strait_stage_calm_colored: "§GCalm§!"
 OBT_strait_stage_friction_colored: "§YFriction§!"
 OBT_strait_stage_coercion_colored: "§OCoercion§!"
 OBT_strait_stage_crisis_colored: "§RCrisis§!"
 OBT_strait_stage_brink_colored: "§RBrink§!"
 OBT_strait_stage_calm_tt: "§GCalm§! (0-19)\n$OBT_strait_effects_calm$"
 OBT_strait_stage_friction_tt: "§YFriction§! (20-39)\n$OBT_strait_effects_friction$"
 OBT_strait_stage_coercion_tt: "§OCoercion§! (40-59)\n$OBT_strait_effects_coercion$"
 OBT_strait_stage_crisis_tt: "§RCrisis§! (60-79)\n$OBT_strait_effects_crisis$"
 OBT_strait_stage_brink_tt: "§RBrink§! (80-100)\n$OBT_strait_effects_brink$"
 OBT_strait_effects_calm: "§YChina§!: +2% stability, +5% political power, +5% trade opinion\n§YTaiwan§!: +2% stability, +5% political power, +5% trade opinion"
 OBT_strait_effects_friction: "§YChina§!: no effect\n§YTaiwan§!: no effect"
 OBT_strait_effects_coercion: "§YChina§!: -1% stability, -2% political power, -5% trade opinion, +2% army organization\n§YTaiwan§!: -2% political power, -3% trade opinion, +3% war support, +2% army defense\nCrisis hotlines are available to both sides."
 OBT_strait_effects_crisis: "§YChina§!: -3% stability, -5% political power, -10% trade opinion, +3% army organization\n§YTaiwan§!: -2% stability, -4% political power, -6% trade opinion, +5% war support, +4% army defense\nTaiwan can declare a Blue Tiger Emergency without a blockade."
 OBT_strait_effects_brink: "§YChina§!: -5% stability, -10% political power, -15% trade opinion, +5% army organization\n§YTaiwan§!: -4% stability, -6% political power, -10% trade opinion, +8% war support, +5% army defense\nBeijing can prepare a contingency war goal."
 OBT_strait_at_least_friction_tt: "Cross-Strait Tension is at least §YFriction§!"
 OBT_strait_at_least_coercion_tt: "Cross-Strait Tension is at least §OCoercion§!"
 OBT_strait_at_least_crisis_tt: "Cross-Strait Tension is at least §RCrisis§!"
 OBT_strait_at_least_brink_tt: "Cross-Strait Tension is at §RBrink§!"
 OBT_strait_at_most_coercion_tt: "Cross-Strait Tension is no higher than §OCoercion§!"
 OBT_strait_at_most_crisis_tt: "Cross-Strait Tension is below §RBrink§!"
 OBT_ind_chi_trust: "Cross-Strait Trust: §Y[?CHI.CHI_TAI_trust|0]§!"
 OBT_ind_us_support: "U.S. Support for Taiwan: §Y[?CHI.CHI_taiwan_us_support|0]§!"
 OBT_ind_chi_burden: "Taiwan Blockade Burden: §Y[?TAI.TAI_blockade_burden|0]§!"
 OBT_ind_chi_ptn: "Taipei's Will to Negotiate (est.): §Y[?TAI.TAI_pressure_to_negotiate|0]§!"
 OBT_ind_tai_ptn: "Pressure to Negotiate: §Y[?TAI.TAI_pressure_to_negotiate|0]§!"
 OBT_ind_tai_burden: "Blockade Burden: §Y[?TAI.TAI_blockade_burden|0]§!"
 OBT_ind_us_confidence: "U.S. Confidence in Taipei: §Y[?TAI.TAI_us_confidence|0]§!"
 OBT_ind_identity: "Taiwan-Centered Identity: §Y[?TAI.TAI_taiwanese_identity|0]§!"
 OBT_ind_chi_trust_tt: "Trust between Beijing and Taipei. Dialogue, trade and restraint raise it; coercion lowers it."
 OBT_ind_us_support_tt: "§YU.S. Support for Taiwan§! is Washington's commitment to deterring Beijing. It rises when China escalates. It is not the same as U.S. Confidence in Taipei."
 OBT_ind_us_confidence_tt: "§YU.S. Confidence in Taipei§! is Washington's trust in Taiwan's government. Restraint raises it; provocations lower it. It is not the same as U.S. Support for Taiwan."
 OBT_ind_burden_tt: "How hard a blockade is hitting Taiwan's economy, after its preparations are counted."
 OBT_ind_ptn_tt: "How strongly Taiwan's public wants talks with Beijing. A high value can open staged talks, which Taiwan can leave at every stage; it never forces capitulation."
 OBT_ind_identity_tt: "How strongly the public identifies with Taiwan rather than with China."
 OBT_strait_stage_CHI: "Cross-Strait Tension"
 OBT_strait_stage_TAI: "Cross-Strait Tension"
 OBT_CHI_crisis_hotline: "Open the Crisis Hotline"
 OBT_CHI_crisis_hotline_desc: "A direct line between the two capitals lets officials talk before an incident becomes a war."
 OBT_CHI_quiet_channel: "Quiet Channel to Taipei"
 OBT_CHI_quiet_channel_desc: "Intermediaries carry private messages across the Strait without either side losing face."
 OBT_CHI_stern_warning: "Issue a Stern Warning"
 OBT_CHI_stern_warning_desc: "A public warning to the authorities in Taipei. It will please nationalists at home and alarm Washington."
 OBT_CHI_patrol_surge: "Surge Coast Guard Patrols"
 OBT_CHI_patrol_surge_desc: "More ships, closer to Taiwan's waters, more often. It trains our crews and costs us abroad."
 OBT_CHI_economic_incentives: "Offer Economic Incentives"
 OBT_CHI_economic_incentives_desc: "Preferential terms for Taiwanese farmers, firms and investors make the mainland harder to refuse."
 OBT_CHI_prepare_contingency: "Prepare a Taiwan Contingency"
 OBT_CHI_prepare_contingency_desc: "Draw up the political and military case for war. It gives us a war goal; it does not declare war, and every capital will see it."
 OBT_TAI_crisis_hotline: "Use the Crisis Hotline"
 OBT_TAI_crisis_hotline_desc: "Call Beijing directly to stop an incident from escalating. Washington welcomes the restraint."
 OBT_TAI_reaffirm_status_quo: "Reaffirm the Status Quo"
 OBT_TAI_reaffirm_status_quo_desc: "A public statement that Taiwan seeks neither independence nor unification today. It calms the Strait and frustrates our own base."
 OBT_TAI_cross_strait_trade_talks: "Reopen Cross-Strait Trade Talks"
 OBT_TAI_cross_strait_trade_talks_desc: "Talks on trade and investment lower the temperature, at the price of deeper dependence on the mainland."
 OBT_TAI_raise_readiness: "Raise Readiness"
 OBT_TAI_raise_readiness_desc: "Cancel leave, disperse aircraft and man the coastal defenses. Beijing will call it a provocation."
 OBT_TAI_civil_defense_drill: "Nationwide Civil Defense Drill"
 OBT_TAI_civil_defense_drill_desc: "Air-raid sirens, shelters and supply points across the island: a rehearsal for the day we hope never comes."
 OBT_TAI_brief_washington: "Brief Washington"
 OBT_TAI_brief_washington_desc: "Share our intelligence on Beijing's pressure with the United States to strengthen its commitment to deterrence."
 obt_strait.1.t: "Tension Rises in the Strait"
 obt_strait.1.d1: "Relations with Taipei have cooled into open friction. Our diplomats and theirs trade sharper words, and the business community is starting to notice."
 obt_strait.1.d2: "Our pressure on Taipei is now unmistakable. Every exercise and every statement is read in Taipei, Tokyo and Washington as coercion."
 obt_strait.1.d3: "The Strait has entered a crisis. Foreign navies are watching, markets are nervous, and the cost to our own economy is rising."
 obt_strait.1.d4: "The Strait stands at the brink. One miscalculation could start a war that no one in Beijing has formally decided to fight."
 obt_strait.1.a: "Press the advantage."
 obt_strait.1.b: "Hold our position."
 obt_strait.1.c: "Signal restraint."
 obt_strait.2.t: "The Strait Cools"
 obt_strait.2.d0: "Cross-Strait relations are calm. Trade flows, tourists cross and the generals on both sides are quiet."
 obt_strait.2.d1: "The worst of the confrontation has passed. Relations remain cool, but the danger of a clash has eased."
 obt_strait.2.d2: "The crisis has eased into steady pressure. We have room to choose our next step."
 obt_strait.2.d3: "We have stepped back from the brink, though the Strait remains in crisis."
 obt_strait.2.a: "Bank the calm."
 obt_strait.2.b: "Remind Taipei of our resolve."
 obt_strait.3.t: "Pressure Across the Strait"
 obt_strait.3.d1: "Beijing's tone has hardened and cross-Strait relations have slipped into friction. The public is uneasy but calm."
 obt_strait.3.d2: "Beijing is now openly coercing us: exercises near our waters, warnings to our partners, pressure on our businesses."
 obt_strait.3.d3: "The Strait is in crisis. Shipping insurers are raising rates, and Washington is asking what we intend to do."
 obt_strait.3.d4: "The Strait stands at the brink. Our forces are on alert, and the world is watching both capitals."
 obt_strait.3.a: "Stand firm."
 obt_strait.3.b: "Call for calm and dialogue."
 obt_strait.3.c: "Consult Washington."
 obt_strait.4.t: "The Strait Eases"
 obt_strait.4.d0: "Relations with the mainland are calm. Ferries run full, investors are confident and the coast guard has a quiet season."
 obt_strait.4.d1: "The confrontation has eased into friction. The pressure has not gone away, but the danger has passed for now."
 obt_strait.4.d2: "Beijing's pressure continues, but the crisis atmosphere has lifted."
 obt_strait.4.d3: "We have stepped back from the brink, though the Strait remains in crisis."
 obt_strait.4.a: "Reopen the channels."
 obt_strait.4.b: "Stay vigilant."
